name: update leetcode stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts and rewrite the SVG
        run: python3 scripts/update_neetcode.py --user daocodes   # <-- your LeetCode handle

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/ide.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ide.svg
          git commit -m "chore: refresh leetcode stats"
          git push
