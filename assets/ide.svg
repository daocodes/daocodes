<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="An animated code editor: the file tree steps through about.md, skills.md, projects.md, awards.md and neetcode.md while the editor pane follows along.">
  <title>daocodes — editor</title>

  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="899" height="439" rx="11"/></clipPath>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      text { white-space: pre; }

      /* ---- 20s loop, five scenes at 4s each ---- */
      .sc  { animation: 20s linear infinite both; }
      .sc0 { animation-name: s0 } .sc1 { animation-name: s1 } .sc2 { animation-name: s2 }
      .sc3 { animation-name: s3 } .sc4 { animation-name: s4 }
      @keyframes s0 { 0%,17%{opacity:1} 20%,97%{opacity:0} 100%{opacity:1} }
      @keyframes s1 { 0%,18%{opacity:0} 21%,37%{opacity:1} 40%,100%{opacity:0} }
      @keyframes s2 { 0%,38%{opacity:0} 41%,57%{opacity:1} 60%,100%{opacity:0} }
      @keyframes s3 { 0%,58%{opacity:0} 61%,77%{opacity:1} 80%,100%{opacity:0} }
      @keyframes s4 { 0%,78%{opacity:0} 81%,96%{opacity:1} 99%,100%{opacity:0} }

      /* ---- content lifts as it fades in ---- */
      .rise  { animation: 20s cubic-bezier(.2,.7,.2,1) infinite both; }
      .rise0 { animation-name: r0 } .rise1 { animation-name: r1 } .rise2 { animation-name: r2 }
      .rise3 { animation-name: r3 } .rise4 { animation-name: r4 }
      @keyframes r0 { 0%,20%{transform:translateY(0)}  96%{transform:translateY(9px)} 100%{transform:translateY(0)} }
      @keyframes r1 { 0%,18%{transform:translateY(9px)} 25%,100%{transform:translateY(0)} }
      @keyframes r2 { 0%,38%{transform:translateY(9px)} 45%,100%{transform:translateY(0)} }
      @keyframes r3 { 0%,58%{transform:translateY(9px)} 65%,100%{transform:translateY(0)} }
      @keyframes r4 { 0%,78%{transform:translateY(9px)} 85%,100%{transform:translateY(0)} }

      /* ---- sidebar selection glides between rows ---- */
      .sel { animation: sel 20s cubic-bezier(.5,0,.2,1) infinite both; }
      @keyframes sel {
        0%,18%   { transform: translateY(0) }
        21%,38%  { transform: translateY(26px) }
        41%,58%  { transform: translateY(52px) }
        61%,78%  { transform: translateY(78px) }
        81%,98%  { transform: translateY(104px) }
        100%     { transform: translateY(0) }
      }

      /* ---- skill bars fill during scene 2 ---- */
      .bar { transform-box: fill-box; transform-origin: 0 50%; animation: 20s cubic-bezier(.2,.8,.2,1) infinite both; }
      .b1 { animation-name: b1 } .b2 { animation-name: b2 }
      .b3 { animation-name: b3 } .b4 { animation-name: b4 }
      @keyframes b1 { 0%,21%{transform:scaleX(0)} 30%,100%{transform:scaleX(1)} }
      @keyframes b2 { 0%,22%{transform:scaleX(0)} 31%,100%{transform:scaleX(1)} }
      @keyframes b3 { 0%,23%{transform:scaleX(0)} 32%,100%{transform:scaleX(1)} }
      @keyframes b4 { 0%,24%{transform:scaleX(0)} 33%,100%{transform:scaleX(1)} }

      /* ---- neetcode bars fill during scene 5 ---- */
      .nb { transform-box: fill-box; transform-origin: 0 50%; animation: 20s cubic-bezier(.2,.8,.2,1) infinite both; }
      .n0 { animation-name: n0 } .n1 { animation-name: n1 } .n2 { animation-name: n2 }
      .n3 { animation-name: n3 } .n4 { animation-name: n4 } .n5 { animation-name: n5 }
      @keyframes n0 { 0%,81%{transform:scaleX(0)} 92%,100%{transform:scaleX(1)} }
      @keyframes n1 { 0%,82%{transform:scaleX(0)} 90%,100%{transform:scaleX(1)} }
      @keyframes n2 { 0%,83%{transform:scaleX(0)} 91%,100%{transform:scaleX(1)} }
      @keyframes n3 { 0%,84%{transform:scaleX(0)} 92%,100%{transform:scaleX(1)} }
      @keyframes n4 { 0%,85%{transform:scaleX(0)} 93%,100%{transform:scaleX(1)} }
      @keyframes n5 { 0%,86%{transform:scaleX(0)} 94%,100%{transform:scaleX(1)} }

      .caret { animation: blink 1.06s steps(1) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

      @media (prefers-reduced-motion: reduce) {
        .sc,.rise,.sel,.bar,.nb,.caret { animation: none }
        .sc1,.sc2,.sc3,.sc4 { opacity: 0 }
      }
    </style>
  </defs>

